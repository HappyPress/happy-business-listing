name: PHPUnit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    strategy:
      matrix:
        php-versions: ['7.4', '8.0', '8.1']
        wordpress-versions: ['latest', '6.0', '5.9']
    
    name: PHP ${{ matrix.php-versions }} - WP ${{ matrix.wordpress-versions }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mbstring, intl, mysqli, zip
        tools: composer:v2
        coverage: xdebug
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y subversion mysql-client
    
    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress
    
    - name: Setup WordPress test environment
      run: |
        chmod +x bin/install-wp-tests.sh
        # Drop the database if it exists and create a fresh one
        mysql -h 127.0.0.1 -u root -proot -e "DROP DATABASE IF EXISTS wordpress_test; CREATE DATABASE wordpress_test;"
        bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress-versions }} true
      env:
        WP_TESTS_DIR: /tmp/wordpress-tests-lib
        WP_CORE_DIR: /tmp/wordpress
    
    - name: Run PHPUnit
      run: |
        # Create a custom phpunit.xml file for this environment
        cat > phpunit.xml.dist << 'EOL'
        <?xml version="1.0"?>
        <phpunit
            bootstrap="tests/bootstrap.php"
            backupGlobals="false"
            colors="true"
            convertErrorsToExceptions="true"
            convertNoticesToExceptions="true"
            convertWarningsToExceptions="true"
            >
            <testsuites>
                <testsuite name="unit">
                    <directory prefix="test-" suffix=".php">./tests/unit/</directory>
                </testsuite>
                <testsuite name="integration">
                    <directory prefix="test-" suffix=".php">./tests/integration/</directory>
                </testsuite>
            </testsuites>
            <filter>
                <whitelist>
                    <directory suffix=".php">./includes</directory>
                    <exclude>
                        <directory suffix=".php">./vendor</directory>
                        <directory suffix=".php">./tests</directory>
                    </exclude>
                </whitelist>
            </filter>
        </phpunit>
        EOL
        
        # Run PHPUnit with verbose output to see what's failing
        vendor/bin/phpunit --coverage-clover=coverage.xml --verbose
      env:
        WP_TESTS_DIR: /tmp/wordpress-tests-lib
        WP_CORE_DIR: /tmp/wordpress
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false