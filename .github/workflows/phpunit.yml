name: PHPUnit Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    strategy:
      matrix:
        php-versions: ['7.4', '8.0', '8.1', '8.2']
        wordpress-versions: ['latest', '6.3', '6.2', '6.1']
    
    name: PHP ${{ matrix.php-versions }} - WP ${{ matrix.wordpress-versions }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, intl, mysqli, zip, gd, curl, xml
          tools: composer:v2
          coverage: xdebug
      
      - name: Validate composer.json and composer.lock
        run: composer validate --strict
      
      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-versions }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-versions }}-
      
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest
      
      - name: Install Subversion (svn)
        run: sudo apt-get update && sudo apt-get install -y subversion
      
      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress-versions }}
      
      - name: Run PHP Syntax Check
        run: find . -name "*.php" -not -path "./vendor/*" -not -path "./tests/*" | xargs -I {} php -l {}
      
      - name: Run PHPUnit Tests
        run: vendor/bin/phpunit --coverage-clover=coverage.xml --verbose
      
      - name: Run PHP Code Sniffer
        run: |
          if [ -f "vendor/bin/phpcs" ]; then
            vendor/bin/phpcs --standard=WordPress --ignore=vendor/ .
          else
            echo "PHPCS not installed, skipping code style check"
          fi
        continue-on-error: true
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
      
      - name: Archive test results
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: test-results-php${{ matrix.php-versions }}-wp${{ matrix.wordpress-versions }}
          path: |
            coverage.xml
            tests/logs/
            /tmp/wordpress-tests-lib/
      
      - name: Slack Notification on Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: 'PHPUnit tests failed for PHP ${{ matrix.php-versions }} - WP ${{ matrix.wordpress-versions }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}